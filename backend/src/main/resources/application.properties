spring.application.name=argo-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/argo}
spring.datasource.username=${DB_USER:argo}
spring.datasource.password=${DB_PASSWORD:1234}

# 只驗證結構
spring.jpa.hibernate.ddl-auto=validate
# 關閉視圖連線
spring.jpa.open-in-view=false

spring.flyway.enabled=true

argo.optcg.base-url=https://optcgapi.com
# 售價為市價乘此倍率
argo.pricing.sale-rate=0.9
# 啟動時同步
argo.sync.on-startup=false
# 啟用定時同步
argo.sync.scheduled=true
# 每天凌晨四點
argo.sync.cron=0 0 4 * * *

# 後台登入有效小時數
argo.admin.session-hours=8
# 允許失敗幾次，超過就鎖定
argo.admin.max-failures=5
# 鎖定分鐘數
argo.admin.lock-minutes=15
# 失敗次數的有效分鐘數
argo.admin.failure-window-minutes=15

# 顧客登入有效天數
argo.customer.session-days=14
# 允許失敗幾次，超過就鎖定
argo.customer.max-failures=5
# 鎖定分鐘數
argo.customer.lock-minutes=15
# 失敗次數的有效分鐘數
argo.customer.failure-window-minutes=15

# 允許的前端網址
argo.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# 官方繁中站
argo.tc.base-url=https://asia-tc.onepiece-cardgame.com
# 請求間隔毫秒
argo.tc.delay-ms=1000
argo.translation.on-startup=false
argo.translation.scheduled=true
# 每週一凌晨五點
argo.translation.cron=0 0 5 * * MON

# 訂單設定
argo.order.currency=USD
argo.order.shipping-fee=0.00
# 未付款保留分鐘數
argo.order.expire-minutes=30
argo.order.expire-scheduled=true

# 受信任的反向代理，只有它轉送的來源 IP 標頭才會被採用，可寫 IP 或 CIDR
argo.security.trusted-proxies=127.0.0.1,::1
# 封鎖名單的記憶體快取毫秒數
argo.security.block-cache-millis=5000
# 是否啟用 IP 限速
argo.ratelimit.enabled=true
# 每個 IP 每分鐘的上限：所有 API、登入與註冊、下單與付款
argo.ratelimit.general-per-minute=300
argo.ratelimit.auth-per-minute=20
argo.ratelimit.checkout-per-minute=30

# 寄件人；要真的寄信再設 spring.mail.host 等
argo.mail.from=no-reply@argo.local
# 信件連結用的官網網址
argo.site-url=http://localhost:5173
# 驗證連結有效小時數
argo.customer.verify-hours=24
# 重寄驗證信的間隔秒數
argo.customer.resend-seconds=60
# 重設密碼連結有效分鐘數
argo.customer.reset-minutes=60
# 註冊驗證碼有效分鐘數
argo.customer.code-minutes=10
# 驗證碼可錯幾次，達到就作廢
argo.customer.max-code-attempts=5

# 監控取樣間隔毫秒
argo.monitor.sample-millis=10000
# 監控預警門檻
argo.monitor.pool-warn=80
argo.monitor.pool-danger=95
argo.monitor.heap-warn=85
argo.monitor.heap-danger=95
argo.monitor.cpu-warn=85
argo.monitor.cpu-danger=95
argo.monitor.p95-warn-ms=2000
argo.monitor.p95-danger-ms=5000
argo.monitor.error-warn=2
argo.monitor.error-danger=5
# 至少幾筆請求才判斷
argo.monitor.min-requests=20
# 連續幾次取樣超標
argo.monitor.sustain-samples=6
# 預警看最近幾分鐘
argo.monitor.alert-window-minutes=5

# 匯率 API
argo.fx.base-url=https://open.er-api.com
# 匯率快取分鐘數
argo.fx.ttl-minutes=60
# 抓不到時的備援匯率
argo.fx.fallback-rate=32.0

# 綠界金流，預設為公開測試商店
argo.ecpay.merchant-id=3002607
argo.ecpay.hash-key=pwFHCqoQZGmho4w6
argo.ecpay.hash-iv=EkRm7iFT261dpevs
argo.ecpay.checkout-url=https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5

# 付款模式：fake 為站內模擬，ecpay 為綠界
argo.payment.mode=fake
# 綠界可連到的後端公開網址
argo.payment.api-url=http://localhost:8080
# 綠界交易查詢網址
argo.ecpay.query-url=https://payment-stage.ecpay.com.tw/Cashier/QueryTradeInfo/V5
# 待付款超過幾分鐘就向綠界對帳
argo.payment.reconcile-minutes=5
# 排程執行緒數，避免長任務擋住其他排程
spring.task.scheduling.pool.size=4
# 每次對帳最多處理幾筆
argo.payment.reconcile-batch=50
