spring.application.name=argo-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/argo}
spring.datasource.username=${DB_USER:argo}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
