spring.application.name=argo-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/argo}
spring.datasource.username=${DB_USER:argo}
spring.datasource.password=${DB_PASSWORD:1234}

# 只驗證結構
spring.jpa.hibernate.ddl-auto=validate
# 關閉視圖連線
spring.jpa.open-in-view=false

spring.flyway.enabled=true

argo.optcg.base-url=https://optcgapi.com
# 售價為市價乘此倍率
argo.pricing.sale-rate=0.9
# 啟動時同步
argo.sync.on-startup=false
# 啟用定時同步
argo.sync.scheduled=true
# 每天凌晨四點
argo.sync.cron=0 0 4 * * *

# 後台登入有效小時數
argo.admin.session-hours=8
# 允許失敗幾次，超過就鎖定
argo.admin.max-failures=5
# 鎖定分鐘數
argo.admin.lock-minutes=15

# 顧客登入有效天數
argo.customer.session-days=14
# 允許失敗幾次，超過就鎖定
argo.customer.max-failures=5
# 鎖定分鐘數
argo.customer.lock-minutes=15

# 允許的前端網址
argo.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# 官方繁中站
argo.tc.base-url=https://asia-tc.onepiece-cardgame.com
# 請求間隔毫秒
argo.tc.delay-ms=1000
argo.translation.on-startup=false
argo.translation.scheduled=true
# 每週一凌晨五點
argo.translation.cron=0 0 5 * * MON

# 訂單設定
argo.order.currency=USD
argo.order.shipping-fee=0.00
# 未付款保留分鐘數
argo.order.expire-minutes=30
argo.order.expire-scheduled=true

# 受信任的反向代理，只有它轉送的來源 IP 標頭才會被採用，可寫 IP 或 CIDR
argo.security.trusted-proxies=127.0.0.1,::1
# 封鎖名單的記憶體快取毫秒數
argo.security.block-cache-millis=5000
# 是否啟用 IP 限速
argo.ratelimit.enabled=true
# 每個 IP 每分鐘的上限：所有 API、登入與註冊、下單與付款
argo.ratelimit.general-per-minute=300
argo.ratelimit.auth-per-minute=20
argo.ratelimit.checkout-per-minute=30
